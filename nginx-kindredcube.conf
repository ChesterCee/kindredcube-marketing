server {
    listen 80;
    listen [::]:80;
    server_name kindredcube.com www.kindredcube.com;
    return 301 https://kindredcube.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name kindredcube.com;

    root /var/www/kindredcube;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/kindredcube.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kindredcube.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_session_tickets off;

    # Disabled so BREACH scanners do not flag the public root page.
    gzip off;
    brotli off;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;

    location ~* \.(?:js|css|png|jpg|jpeg|gif|webp|svg|ico|woff2?)$ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location = /downloads/kindredcube.apk {
        types { application/vnd.android.package-archive apk; }
        add_header Content-Disposition 'attachment; filename="kindredcube.apk"';
        try_files $uri =404;
    }

    # Keep previously shared privacy-policy links working at the new canonical URL.
    location = /privacy-policy { return 301 /privacy; }
    location = /privacy-policy/ { return 301 /privacy/; }
    location ~ ^/privacy-policy/(.*)$ { return 301 /privacy/$1; }

    location = /privacy { try_files /privacy/index.html =404; }
    location = /privacy/ { try_files /privacy/index.html =404; }
    location = /terms { try_files /terms/index.html =404; }
    location = /terms/ { try_files /terms/index.html =404; }
    location = /community-guidelines { try_files /community-guidelines/index.html =404; }
    location = /community-guidelines/ { try_files /community-guidelines/index.html =404; }
    location = /delete-account { try_files /delete-account/index.html =404; }
    location = /delete-account/ { try_files /delete-account/index.html =404; }
    location = /sign-in-register { try_files /sign-in-register/index.html =404; }
    location = /sign-in-register/ { try_files /sign-in-register/index.html =404; }
    location = /download { return 301 /sign-in-register; }
    location = /download/ { return 301 /sign-in-register/; }
    location = /tectavis { try_files /tectavis/index.html =404; }
    location = /tectavis/ { try_files /tectavis/index.html =404; }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.kindredcube.com;
    ssl_certificate /etc/letsencrypt/live/kindredcube.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kindredcube.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    return 301 https://kindredcube.com$request_uri;
}
